<div style="padding: 20px">
  <h2>Gestión de Clientes</h2>

  <!-- Formulario simple para crear -->
  <form (submit)="registrar(); $event.preventDefault()">
    <div>
      <label>Nombre:</label>
      <input type="text" [(ngModel)]="nuevoCliente.nombre_cliente" name="nombre" required />
    </div>
    <div>
      <label>Telefono:</label>
      <input type="text" [(ngModel)]="nuevoCliente.telefono_cliente" name="telefono" required />
    </div>
    <div>
      <label>Direccion:</label>
      <input type="text" [(ngModel)]="nuevoCliente.direccion" name="direccion" required />
    </div>
    <div>
      <label>Enlace mapa:</label>
      <input type="text" [(ngModel)]="nuevoCliente.enlace_mapa" name="enlace" required />
    </div>
    <button type="submit">Guardar Cliente</button>
  </form>

  <hr />

  <!-- Tabla de listado -->
  <h3>Lista de Clientes</h3>
  <table border="1" cellpadding="8">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Telefono</th>
        <th>Direccion</th>
        <th>Enlace</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let c of clientes">
        <td>{{ c.id_clientes }}</td>
        <td>{{ c.nombre_cliente }}</td>
        <td>{{ c.telefono_cliente }}</td>
        <td>{{ c.direccion }}</td>
        <td>{{ c.enlace_mapa }}</td>
      </tr>
    </tbody>
  </table>
</div>
